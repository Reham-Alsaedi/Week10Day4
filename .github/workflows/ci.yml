name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '8.0'  

    - name: Restore dependencies
      run: dotnet restore ProductApp.sln

    - name: Build
      run: dotnet build ProductApp.sln --configuration Release

    - name: Run tests
      run: dotnet test ProductApp.Tests --configuration Release --logger trx

    - name: Upload test results
      uses: actions/upload-artifact@v2
      with:
        name: test-results
        path: **/*.trx

